name: CI

# El wrapper de Gradle (gradle/wrapper/gradle-wrapper.jar) no está commiteado
# a propósito (ver README) — por eso este workflow instala Gradle directo con
# gradle/actions/setup-gradle en vez de invocar ./gradlew. Cuando el wrapper
# jar exista en el repo, cambiar los pasos de "gradle ..." a "./gradlew ...".
#
# Fase 6 del plan de estabilidad (2026-08): Lint venía corriendo ANTES de
# Assemble debug y sin continue-on-error -- confirmado en el historial de
# runs (#69 a #73 y otros anteriores, ej. #19/#20) que Lint falla con
# frecuencia y bloqueaba TODO lo que seguía, así que "Assemble debug" (la
# única señal real de "¿compila?") nunca llegaba a correr en esos runs. Se
# invierte el orden: compilar primero (bloqueante de verdad, es la señal que
# importa), lint después con continue-on-error para que sus warnings sigan
# siendo visibles (annotation + reporte) sin tapar si el código compila.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace

      - name: Lint
        continue-on-error: true
        run: gradle lint --stacktrace

      - name: Subir reporte de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
