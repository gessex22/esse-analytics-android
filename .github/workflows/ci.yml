name: CI

# gradle/gradle-daemon-jvm.properties exige toolchainVendor=jetbrains y
# toolchainVersion=21 para el daemon de Gradle — por eso el JDK que instala
# setup-java tiene que ser ese mismo (distribution: jetbrains, java-version
# 21). Con Temurin 17 el build falla antes de llegar a compilar nada
# ("Cannot find a Java installation matching Java 21 vendor jetbrains"). El
# token de GitHub se pasa al step para evitar el rate-limit no autenticado
# (60 req/hora) al resolver el catálogo de builds de JetBrains Runtime.
#
# El wrapper de Gradle (gradle/wrapper/gradle-wrapper.jar + .properties,
# apuntando a Gradle 9.5.0) está commiteado, así que este workflow corre
# ./gradlew directamente en vez de instalar una versión de Gradle aparte
# (evita el desfasaje que había antes entre el Gradle de CI y el del
# wrapper). gradle/actions/setup-gradle se mantiene solo por el caching de
# dependencias/builds y el step summary que agrega, no para proveer el
# binario de Gradle.
#
# Fase 6 del plan de estabilidad (2026-08): Lint venía corriendo ANTES de
# Assemble debug y sin continue-on-error -- confirmado en el historial de
# runs (#69 a #73 y otros anteriores, ej. #19/#20) que Lint falla con
# frecuencia y bloqueaba TODO lo que seguía, así que "Assemble debug" (la
# única señal real de "¿compila?") nunca llegaba a correr en esos runs. Se
# invierte el orden: compilar primero (bloqueante de verdad, es la señal que
# importa), lint después con continue-on-error para que sus warnings sigan
# siendo visibles (annotation + reporte) sin tapar si el código compila.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew lint --stacktrace

      - name: Subir reporte de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
